# Local infrastructure for myRAG.
#
# Postgres, and the agent.
#
# Qdrant stays embedded — a library writing to a folder, single-process, no
# container. That constraint is not a flaw to design around: it is what forces
# `QDRANT_URL` at stage 1.3, when a separate worker process needs concurrent
# access to the index. Adding Qdrant here then is a dozen lines.
#
# ── Why the agent is containerised and the backend is not ────────────────────
#
# Not symmetry, and not stage 15.1 arriving early for its own sake. Windows
# Smart App Control refuses to load `grpcio`'s unsigned compiled binary, which
# `qdrant-client` imports. The policy governs the Windows host and does not
# reach inside a Linux container, so the agent runs here and the policy stays
# switched on.
#
# The backend keeps running on the host under `uvicorn --reload`, which is the
# faster loop and has no such problem. It reaches the agent on localhost:8001
# through the published port.
#
#   docker compose up -d      start Postgres in the background
#   docker compose ps         check health
#   docker compose logs -f    follow its output
#   docker compose down       stop, keeping data
#   docker compose down -v    stop and DELETE the data volume

services:
  postgres:
    # Pinned to a major version, never `latest`. A silent jump from 17 to 18
    # on someone else's machine is a class of bug that costs a day to find,
    # and the alpine variant is roughly a quarter the size.
    image: postgres:17-alpine

    container_name: myrag-postgres

    environment:
      # Defaults so `docker compose up` works with no setup at all. These are
      # throwaway local development credentials for a container reachable only
      # from this machine — they are not secrets, and they are visible in this
      # file by design.
      #
      # Real credentials arrive at stage 15.3, which names secret handling and
      # rotation explicitly. Nothing here should ever be reused there.
      POSTGRES_USER: ${POSTGRES_USER:-myrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myrag_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-myrag}

    ports:
      # host:container. Bound so psql, Alembic and the backend can all reach it
      # from Windows directly. At stage 15.1, when the backend is itself a
      # container on this network, this mapping becomes a development
      # convenience rather than a requirement.
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # A *named* volume, not a bind mount into the repository.
      #
      # A bind mount would put Postgres's data directory inside the working
      # tree, where it would need gitignoring, would break on Windows file
      # permissions, and would be destroyed by a careless `git clean`. The
      # named volume is managed by Docker and survives `docker compose down`.
      #
      # `docker compose down -v` is the only thing that deletes it — which is
      # also how you get a clean database when a migration goes wrong.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # `pg_isready` answers "is the server accepting connections?" — which is
      # not the same as "is the container running". Postgres takes a few
      # seconds to initialise on first start, and without this check anything
      # depending on it would race the startup and fail with a confusing
      # connection error.
      #
      # At stage 15.1, when the backend is a service in this file, it gains
      # `depends_on: postgres: condition: service_healthy` and this check
      # becomes the thing that makes the ordering correct.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-myrag} -d ${POSTGRES_DB:-myrag}",
        ]
      interval: 5s
      timeout: 5s
      # Generous: the *first* start initialises the data directory, which is
      # much slower than later ones. A tight retry count here fails the first
      # `docker compose up` on a slow machine and looks like a broken config.
      retries: 10
      start_period: 10s

    # Survives a Docker Desktop restart, but not a `docker compose down`.
    # `always` would restart it even after you deliberately stopped it.
    restart: unless-stopped

  agent:
    build:
      # The repository root, because the agent installs the sibling `rag`
      # package with `-e ../rag`. A context of `agent/` cannot see it.
      context: .
      dockerfile: agent/Dockerfile

    container_name: myrag-agent

    # Keys arrive at runtime, never baked into the image. `.dockerignore`
    # excludes `.env` from the build context so it cannot be copied in by
    # accident.
    env_file:
      - ./agent/.env

    environment:
      # Override the host-shaped defaults from agent/.env.example. Inside the
      # container the index lives on a volume, not next to the source.
      QDRANT_PATH: /app/agent/qdrant_data

    ports:
      # The backend runs on the host and calls http://localhost:8001.
      - "8001:8001"

    volumes:
      # Source mounted read-only, so a code change needs
      # `docker compose restart agent` rather than a rebuild. Read-only
      # because nothing in the container should ever write to your working
      # tree.
      - ./agent/app:/app/agent/app:ro
      - ./rag/rag:/app/rag/rag:ro

      # A named volume rather than a bind mount to ./agent/qdrant_data.
      #
      # Embedded Qdrant takes an exclusive file lock on its storage folder, and
      # file locking across a Windows bind mount goes through a translation
      # layer that does not always honour it. A named volume is ordinary Linux
      # filesystem and behaves predictably.
      #
      # The cost is real and worth stating: this is a *different* index from
      # the one in ./agent/qdrant_data. Documents indexed before this change
      # are not in it, and anything on the host — the stage 3.1 evaluation
      # harness, for instance — cannot read it directly.
      - agent_qdrant_data:/app/agent/qdrant_data

    healthcheck:
      # No curl in the slim image, and adding one for a health check is 10 MB
      # for a line of Python that is already present.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8001/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

volumes:
  postgres_data:
    name: myrag_postgres_data
  agent_qdrant_data:
    name: myrag_agent_qdrant_data
