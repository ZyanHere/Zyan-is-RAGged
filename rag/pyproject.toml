[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag"
version = "0.1.0"
description = "The myRAG retrieval engine. A library, not a service."
requires-python = ">=3.11"

# Deliberately no fastapi, no httpx, no openai. This package is imported by
# the agent and — from stage 3.1 onward — directly by the evaluation harness
# with no web server and no chat model anywhere in the measurement path.
dependencies = [
    "pypdf>=5.0",
    "qdrant-client>=1.9",
    "google-genai>=1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]