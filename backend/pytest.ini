[pytest]
testpaths = tests

# Every test here talks to Postgres, so every test is async. Without "auto"
# mode each one needs an @pytest_asyncio decorator, and a forgotten decorator
# does not fail — pytest collects the coroutine, never awaits it, and reports
# a pass. A test that passes without running is worse than no test.
asyncio_mode = auto

# Each test gets its own event loop. The alternative, a session-scoped loop, is
# faster and couples the tests: a connection left open by one test is still
# attached to the loop the next one uses, and the failure surfaces somewhere
# unrelated.
asyncio_default_fixture_loop_scope = function

addopts = -q --strict-markers
